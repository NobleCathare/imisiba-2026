<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Imisiba PRINT - Éleveurs</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400&display=swap"
        rel="stylesheet">
    <style>
        @page {
            size: 150mm 150mm;
            margin: 0;
        }

        body {
            margin: 0;
            padding: 0;
            width: 150mm;
            height: 150mm;
            background: #f4f1ea;
            color: #2b3a42;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            border: 1mm solid #c5a059;
            box-sizing: border-box;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 24pt;
            margin: 0;
            color: #2b3a42;
        }

        .icon {
            font-size: 48pt;
            margin: 10mm 0;
        }

        .qr-placeholder {
            width: 40mm;
            height: 40mm;
            background: #fff;
            border: 2px solid #2b3a42;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 5mm auto;
        }

        .cta {
            font-size: 12pt;
            font-weight: bold;
            color: #6b8c42;
        }
    </style>
</head>

<body>
    <h1>ÉLEVEURS AMBITIEUX</h1>
    <div class="icon">🐂</div>
    <p>La clé de l'autosuffisance.</p>

    <div class="qr-placeholder">QR CODE</div>

    <p class="cta">Scannez pour découvrir votre impact</p>
    <small>imisiba.github.io/2026</small>
</body>

</html>
